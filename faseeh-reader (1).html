<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Faseeh reader</title></head>
<body><a id="reader" href="http://127.0.0.1:8000/">Open the Faseeh practice studio</a>
<script>
  const address = location.protocol === 'file:' || location.port === '8080'
    ? 'http://127.0.0.1:8000/' : new URL('/', location.href).href;
  document.getElementById('reader').href = address;
  location.replace(address);
</script></body></html>
